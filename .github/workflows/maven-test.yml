name: Authentication Tests

on:
  pull_request:
    branches:
      - main

jobs:
  authentication-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run AuthenticationTest
        run: mvn -Dtest=AuthenticationTest test
